<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Attention Nutrition</title><style>body{background:#f6f5ef;color:#244536;font:16px system-ui;min-height:90vh;display:grid;place-items:center}main{background:white;border:1px solid #dce5da;border-radius:24px;padding:32px;max-width:420px;width:90%}h1{letter-spacing:-.05em}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:12px;margin-top:12px;font:inherit}input{border:1px solid #cdd9cf}button{border:0;background:#284e3e;color:white;cursor:pointer}p{color:#657a6c;line-height:1.5}a{color:#284e3e}</style><main><h1>Connect your attention.</h1><p>Use the same email on both devices. We'll send you a sign-in link.</p><form id="f"><input id="email" type="email" placeholder="Email address" required><button>Send sign-in link</button></form><p id="msg"></p><a id="back" href="index.html">Back to apps</a></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="cloud.js"></script><script>let next=new URLSearchParams(location.search).get('next')||'index.html';if(!/^(index|content_facts|attention_nutrition)\.html$/.test(next))next='index.html';document.getElementById('back').href=next;AttentionCloud.getUser().then(u=>{if(u){document.getElementById('msg').textContent='Signed in as '+u.email;setTimeout(()=>location.replace(next),900)}});document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await AttentionCloud.login(document.getElementById('email').value);document.getElementById('msg').textContent='Check your inbox for the sign-in link.'}catch(err){document.getElementById('msg').textContent=err.message}finally{b.disabled=false}};</script></html>
